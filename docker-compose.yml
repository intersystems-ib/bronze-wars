services:
  bronzewars-iris:
    init: true
    container_name: bronzewars-iris
    build:
      context: .
      dockerfile: iris/Dockerfile
    ports:
      - "127.0.0.1:52774:52773"
      - "127.0.0.1:51774:1972"
    volumes:
      - ./iris/shared:/iris-shared
    environment:
      ISC_DATA_DIRECTORY: /iris-shared/durable
    command: --check-caps false --ISCAgent false
    depends_on:
      - qwen
    restart: unless-stopped

  webgateway:
    init: true
    container_name: bronzewars-webgateway
    build:
      context: .
      dockerfile: webgateway/Dockerfile
    hostname: webgateway
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    environment:
      ISC_DATA_DIRECTORY: /webgateway-shared/durable
      ISC_CSP_CONF_FILE: /webgateway-shared/CSP.conf
      ISC_CSP_INI_FILE: /webgateway-shared/CSP.ini
    volumes:
      - ./webgateway/shared:/webgateway-shared
    depends_on:
      - bronzewars-iris
    restart: unless-stopped

  bronzewars-frontend:
    init: true
    container_name: bronzewars-frontend
    build:
      context: ./bronzewars-frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - webgateway
    restart: unless-stopped

  qwen:
    image: ${QWEN_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: ${COMPOSE_PROJECT_NAME:-ai-orchestrator}-qwen
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-mmap
      - -m
      - /models/${QWEN_MODEL_FILE:-Qwen3.5-9B-Q5_K_M.gguf}
      - --alias
      - ${QWEN_MODEL_ALIAS:-qwen3.5-9b}
      - -c
      - "${QWEN_CONTEXT_SIZE:-8192}"
      - -t
      - "${QWEN_THREADS:-12}"
      - --temp
      - "${QWEN_TEMPERATURE:-0.2}"
      - --jinja
      - --chat-template-file
      - /models/qwen3.5-bronzewars.jinja
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
    ports:
      - "${QWEN_PORT:-8001}:8000"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    restart: unless-stopped
