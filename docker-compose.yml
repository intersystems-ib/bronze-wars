services:
  bronzewars-iris:
    init: true
    container_name: bronzewars-iris
    build:
      context: .
      dockerfile: iris/Dockerfile
    ports:
      - "52774:52773"
      - "51774:1972"
    volumes:
      - ./iris/shared:/iris-shared
    environment:
      ISC_DATA_DIRECTORY: /iris-shared/durable
    command: --check-caps false --ISCAgent false
    depends_on:
      - llama
    restart: unless-stopped

  webgateway:
    init: true
    container_name: bronzewars-webgateway
    build:
      context: .
      dockerfile: webgateway/Dockerfile
    hostname: webgateway
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      ISC_DATA_DIRECTORY: /webgateway-shared/durable
      ISC_CSP_CONF_FILE: /webgateway-shared/CSP.conf
      ISC_CSP_INI_FILE: /webgateway-shared/CSP.ini
    volumes:
      - ./webgateway/shared:/webgateway-shared
    depends_on:
      - bronzewars-iris
    restart: unless-stopped

  bronzewars-frontend:
    init: true
    container_name: bronzewars-frontend
    build:
      context: ./bronzewars-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - webgateway
    restart: unless-stopped

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: bronzewars-llama-agent
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8000",
        "--no-mmap",
        "-m", "/models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf",
        "--alias", "llama-3.1-8b-instruct",
        "-c", "4096",
        "-ngl", "999",
        "-t", "12",
        "--temp", "0.2",
        "--jinja",
        "--chat-template-file", "/models/meta-llama-Llama-3.1-8B-Instruct.jinja"
      ]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 150s
    restart: unless-stopped
